name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node ">=18". The matrix is what
        # actually holds that claim to account — if the oldest entry fails,
        # the engines field is wrong and gets corrected, not the matrix.
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No dependencies to install — the project is deliberately zero-dep,
      # so there is no lockfile and nothing to cache.
      - name: Show environment
        run: node --version

      - name: Run test suite
        run: npm test

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Exercises the real pipeline the way a user does, which unit tests
      # alone don't cover: analyzer -> evaluation -> scoring -> report files
      # on disk, then the dashboard reading those files back.
      - name: Evaluate the bundled fixtures
        run: |
          node bin/evaluate-skill.js fixtures/simple-skill --out /tmp/smoke/simple
          node bin/evaluate-skill.js fixtures/multi-step-skill --out /tmp/smoke/multi

      - name: Verify the expected report artifacts exist
        run: |
          set -e
          for skill in simple multi; do
            for f in REPORT.md scores.json test-results.json report.html; do
              path="/tmp/smoke/$skill/skill-evaluation/$f"
              test -s "$path" || { echo "missing or empty: $path"; exit 1; }
            done
          done
          echo "All report artifacts present."

      - name: Build the dashboard over those reports
        run: |
          node bin/dashboard.js /tmp/smoke --out /tmp/smoke/dashboard.html
          test -s /tmp/smoke/dashboard.html

      - name: Verify the evaluated skills were not modified
        run: |
          set -e
          # Must cover new files as well as edits: the evaluator's default
          # output location is <skill>/skill-evaluation/, so the most likely
          # regression is an *added* directory inside the fixture — which
          # `git diff` alone does not see, since it ignores untracked paths.
          changes="$(git status --porcelain --untracked-files=all -- fixtures/)"
          if [ -n "$changes" ]; then
            echo "The evaluator modified the skill it evaluated — this violates the project's core non-goal."
            echo "$changes"
            exit 1
          fi
          echo "Fixtures untouched (no edits, no new files), as required."

      # The UI adds a second way to reach the same pipeline, so the smoke
      # test covers it end to end too: start the server, drive the real HTTP
      # API the browser uses, and confirm a run triggered through it produces
      # a report without touching the skill.
      - name: Start the UI server and evaluate through its API
        run: |
          set -e
          mkdir -p /tmp/ui-workspace /tmp/ui-out
          cp -r fixtures/simple-skill /tmp/ui-workspace/

          node bin/ui.js /tmp/ui-workspace --port 4173 --out /tmp/ui-out &
          UI_PID=$!
          trap 'kill $UI_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 40); do
            kill -0 $UI_PID 2>/dev/null || { echo "the UI server exited during startup"; exit 1; }
            curl -fsS http://127.0.0.1:4173/api/state >/dev/null 2>&1 && break
            sleep 0.25
          done

          curl -fsS http://127.0.0.1:4173/ | grep -q 'Skill Evaluator'
          id="$(curl -fsS http://127.0.0.1:4173/api/state | node -e "
            let d=''; process.stdin.on('data', c => d += c).on('end', () => {
              const s = JSON.parse(d).skills.find(s => s.skillName === 'simple-skill');
              if (!s) { console.error('simple-skill not discovered by the UI'); process.exit(1); }
              process.stdout.write(s.id);
            });")"

          curl -fsS -X POST http://127.0.0.1:4173/api/evaluate \
            -H 'Content-Type: application/json' -d "{\"id\":\"$id\"}" >/dev/null

          for i in $(seq 1 60); do
            test -s /tmp/ui-out/skill-evaluation/scores.json && break
            sleep 0.5
          done
          test -s /tmp/ui-out/skill-evaluation/scores.json \
            || { echo "the run triggered through the UI produced no report"; exit 1; }

          # A request naming a filesystem path instead of a discovered id must
          # not reach the runner. 404 is the documented answer.
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:4173/api/evaluate \
            -H 'Content-Type: application/json' -d '{"skillPath":"/etc"}')"
          test "$code" = "404" || { echo "path-in-body was not rejected (HTTP $code)"; exit 1; }

          echo "UI API smoke test passed."

      - name: Verify the UI did not modify the skill it evaluated
        run: |
          set -e
          diff -r fixtures/simple-skill /tmp/ui-workspace/simple-skill \
            || { echo "the UI modified the skill it evaluated"; exit 1; }
          changes="$(git status --porcelain --untracked-files=all -- fixtures/)"
          if [ -n "$changes" ]; then
            echo "The UI wrote into the repository's fixtures."
            echo "$changes"
            exit 1
          fi
